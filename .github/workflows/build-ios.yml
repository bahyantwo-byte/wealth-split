name: Build iOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor iOS
        run: npm install @capacitor/ios

      - name: Copy web files to www
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp -r icons www/ 2>/dev/null || true
          cp -r assets www/ 2>/dev/null || true

      - name: Inject Supabase credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          SHORTCUT_URL="https://${OWNER}.github.io/${REPO}/QuickSpend.shortcut"
          sed -i "s|__SUPABASE_URL__|${SUPABASE_URL}|g" www/index.html
          sed -i "s|__SUPABASE_ANON_KEY__|${SUPABASE_ANON_KEY}|g" www/index.html
          sed -i "s|__SHORTCUT_URL__|${SHORTCUT_URL}|g" www/index.html
          echo "Credentials and shortcut URL injected."

      - name: Generate and commit QuickSpend shortcut
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p docs
          python3 scripts/generate_shortcut.py \
            "${SUPABASE_URL}" \
            "${SUPABASE_ANON_KEY}" \
            "docs/QuickSpend.shortcut.xml"
          plutil -convert binary1 -o "docs/QuickSpend.shortcut" "docs/QuickSpend.shortcut.xml"
          rm docs/QuickSpend.shortcut.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/QuickSpend.shortcut
          git diff --staged --quiet || git commit -m "Update QuickSpend shortcut [skip ci]"
          git push
          echo "Shortcut committed to docs/"

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Patch AppDelegate for direct URL injection
        run: python3 scripts/patch_appdelegate.py

      - name: Register URL scheme in Info.plist
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.wealthsplit.app" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string wealthsplit" "$PLIST" 2>/dev/null || true

      - name: Build iOS (ad-hoc signed)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/App.app" Payload/
          zip -r WealthSplit.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WealthSplit-iOS
          path: WealthSplit.ipa
          retention-days: 30
